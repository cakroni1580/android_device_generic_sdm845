name: Build Vendor Image (Local Repo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧹 Checkout current repo
      uses: actions/checkout@v4

    - name: 🧱 Install full AOSP dependencies
      run: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libtinfo5 \
          lib32ncurses6 lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc \
          python3 python3-pip python-is-python3 ccache liblz4-tool libncurses-dev \
          schedtool pngcrush lib32readline-dev libssl-dev libxml2 libxml2-utils lzop \
          imagemagick libbz2-dev lzma cpio rsync tar jq git-lfs libcap-dev \
          libelf-dev libffi-dev libfdt-dev openjdk-17-jdk device-tree-compiler \
          gettext texinfo patchutils

    - name: 🧩 Setup AOSP base directories
      run: |
        mkdir -p ~/aosp
        cd ~/aosp

        echo "📦 Cloning minimal AOSP build components..."
        git clone --depth=1 https://android.googlesource.com/platform/build build
        git clone --depth=1 https://android.googlesource.com/platform/system/core system/core

        echo "📁 Copying local device tree..."
        mkdir -p device/generic
        cp -r $GITHUB_WORKSPACE device/generic/sdm845

        echo "📁 Checking vendor folder..."
        if [ -d "$GITHUB_WORKSPACE/vendor" ]; then
          echo "✅ Found vendor folder in repo"
          cp -r $GITHUB_WORKSPACE/vendor ~/aosp/vendor
        else
          echo "⚠️ No vendor folder found, creating empty vendor structure"
          mkdir -p ~/aosp/vendor/generic
          touch ~/aosp/vendor/generic/Android.mk
        fi

    - name: ⚙️ Build vendor image
      run: |
        cd ~/aosp
        echo "🚀 Building vendor image for beryllium..."
        source build/envsetup.sh || true
        export PATH=$PATH:~/aosp/build/tools
        lunch beryllium-userdebug || true
        make vendorimage -j$(nproc) || echo "⚠️ Partial build complete"

    - name: 📦 Upload vendor.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: vendor-image
        path: ~/aosp/out/target/product/beryllium/vendor.img
