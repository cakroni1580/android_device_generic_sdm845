name: Build Vendor (Beryllium SDM845)

on:
  workflow_dispatch:

jobs:
  build-vendor:
    name: Build vendor.img for Beryllium
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core make python3 e2fsprogs simg2img \
            mtools mkbootimg bc bison flex zip curl wget ca-certificates \
            build-essential ccache libssl-dev rsync

      - name: Prepare minimal source tree
        run: |
          mkdir -p ~/aosp-repo
          cd ~/aosp-repo

          echo "📦 Cloning minimal AOSP build components..."
          git clone --depth=1 https://android.googlesource.com/platform/build build
          git clone --depth=1 https://android.googlesource.com/platform/system/core system/core

          echo "📦 Cloning device and vendor trees..."
          git clone --depth=1 https://github.com/aospm/android_device_generic_sdm845.git device/generic/sdm845
          git clone --depth=1 https://github.com/aospm/android_vendor_generic.git vendor/generic

          mkdir -p out/target/product/beryllium/vendor
          # Copy your firmware or blobs here if needed
          # cp -r path/to/a630_* out/target/product/beryllium/vendor/firmware/

      - name: Build vendor.img (ext4)
        run: |
          cd ~/aosp-repo
          echo "🔧 Building vendor image..."
          make_ext4fs -s -T 0 -l 1073741824 -a vendor out/vendor.img out/target/product/beryllium/vendor
          ls -lh out/vendor.img

      - name: Upload vendor.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-beryllium
          path: ~/aosp-repo/out/vendor.img
