name: Build Minimal Vendor (beryllium)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-vendor:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup build environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncurses5-dev:i386 \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip bc python3

      - name: 🏗️ Clone AOSP base components
        run: |
          mkdir -p ~/aosp-repo
          cd ~/aosp-repo

          echo "📦 Cloning minimal AOSP build components..."
          git clone --depth=1 https://android.googlesource.com/platform/build build
          git clone --depth=1 https://android.googlesource.com/platform/system/core system/core

          echo "📦 Cloning device and vendor trees..."
          git clone --depth=1 https://github.com/aospm/android_device_generic_sdm845.git device/generic/sdm845
          git clone --depth=1 https://github.com/aospm/android_vendor_generic.git vendor/generic || \
            (echo "⚠️ vendor repo mungkin private, coba pakai token nanti" && exit 1)

          mkdir -p out/target/product/beryllium/vendor

      - name: 🧩 Set up environment & build vendor image
        run: |
          cd ~/aosp-repo
          source build/envsetup.sh || true

          echo "🔧 Generating makefiles..."
          lunch beryllium-userdebug || true

          echo "⚙️ Building vendor image..."
          make vendorimage -j$(nproc)

      - name: 📦 Collect build artifacts
        run: |
          mkdir -p $GITHUB_WORKSPACE/output
          cp -a ~/aosp-repo/out/target/product/beryllium/vendor.img $GITHUB_WORKSPACE/output/vendor.img || true

      - name: 🚀 Upload vendor image
        uses: actions/upload-artifact@v4
        with:
          name: vendor-beryllium
          path: output/vendor.img
