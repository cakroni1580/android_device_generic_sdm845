name: Build Vendor Image (Beryllium SDM845)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: 🧰 Setup environment
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev libncurses5-dev:i386 \
            x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc \
            unzip bc python3

      - name: 📂 Checkout this repo
        uses: actions/checkout@v4

      - name: ⚙️ Prepare AOSP directories
        run: |
          mkdir -p ~/aosp-repo
          cd ~/aosp-repo

          echo "📦 Cloning minimal AOSP build components..."
          git clone --depth=1 https://android.googlesource.com/platform/build build
          git clone --depth=1 https://android.googlesource.com/platform/system/core system/core

          echo "📦 Cloning device and vendor trees..."
          git clone --depth=1 https://github.com/cakroni1580/android_device_generic_sdm845.git device/generic/sdm845
          git clone --depth=1 https://github.com/aospm/android_vendor_generic.git vendor/generic || \
            git clone --depth=1 https://${{ secrets.GITHUB_TOKEN }}@github.com/aospm/android_vendor_generic.git vendor/generic

          mkdir -p out/target/product/beryllium/vendor

      - name: 🧱 Build vendor image only
        run: |
          cd ~/aosp-repo
          source build/envsetup.sh || true
          export TARGET_PRODUCT=beryllium
          export TARGET_BUILD_VARIANT=userdebug
          echo "🚧 Building vendor image..."
          make vendorimage -j$(nproc) || make -j$(nproc)

      - name: 📦 Upload vendor.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor-image-beryllium
          path: ~/aosp-repo/out/target/product/beryllium/vendor.img
