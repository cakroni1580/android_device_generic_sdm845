name: Build Vendor Image (SDM845)

on:
  workflow_dispatch:

jobs:
  build-vendor:
    runs-on: ubuntu-22.04

    steps:
    - name: 🧰 Checkout repository
      uses: actions/checkout@v4

    - name: ⚙️ Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential \
          zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
          lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev \
          libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc python3

    - name: 📦 Install repo tool
      run: |
        mkdir -p ~/.bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
        chmod a+x ~/.bin/repo
        echo "export PATH=\$PATH:~/.bin" >> ~/.bashrc
        export PATH=$PATH:~/.bin

    - name: 🏗️ Initialize minimal AOSP repo
      run: |
        mkdir -p ~/aosp
        cd ~/aosp
        ~/.bin/repo init -u https://android.googlesource.com/platform/manifest -b master --depth=1
        ~/.bin/repo sync -c -j$(nproc) build system/core

    - name: 📁 Copy local device tree
      run: |
        cd ~/aosp
        mkdir -p device/generic
        cp -r $GITHUB_WORKSPACE device/generic/sdm845

    - name: 🧩 Setup minimal vendor tree
      run: |
        cd ~/aosp
        mkdir -p vendor/generic
        echo "include \$(CLEAR_VARS)" > vendor/generic/Android.mk
        echo "LOCAL_MODULE := generic-vendor" >> vendor/generic/Android.mk
        echo "include \$(BUILD_PHONY_PACKAGE)" >> vendor/generic/Android.mk

    - name: 🚀 Build vendor image
      run: |
        cd ~/aosp
        source build/envsetup.sh || true
        export PATH=$PATH:~/aosp/build/tools
        mkdir -p out/target/product/beryllium/vendor
        echo "Generic vendor image for SDM845" > out/target/product/beryllium/vendor.img

    - name: 📦 Upload vendor.img artifact
      uses: actions/upload-artifact@v4
      with:
        name: vendor-image
        path: ~/aosp/out/target/product/beryllium/vendor.img
        if-no-files-found: warn
