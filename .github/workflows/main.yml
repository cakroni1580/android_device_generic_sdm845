name: Build GKI Kernel (Poco F1)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git bc bison flex libssl-dev \
              build-essential make libc6-dev libncurses5-dev \
              ccache curl zstd wget python3 python3-pip unzip

      - name: Clone LineageOS prebuilt clang & tools
        run: |
          mkdir -p ~/toolchain
          cd ~/toolchain
          git clone https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Set environment variables
        run: |
          echo "export PATH=~/toolchain/clang/bin:~/toolchain/gcc64/bin:~/toolchain/gcc32/bin:$PATH" >> $GITHUB_ENV
          echo "export ARCH=arm64" >> $GITHUB_ENV
          echo "export SUBARCH=arm64" >> $GITHUB_ENV
          echo "export CROSS_COMPILE=aarch64-linux-android-" >> $GITHUB_ENV
          echo "export CROSS_COMPILE_ARM32=arm-linux-androideabi-" >> $GITHUB_ENV
          echo "export CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "export KBUILD_BUILD_USER=actions" >> $GITHUB_ENV
          echo "export KBUILD_BUILD_HOST=github" >> $GITHUB_ENV
          echo "export TARGET_KERNEL_USE=android12-5.4" >> $GITHUB_ENV

      - name: Build Kernel
        run: |
          make O=out beryllium_defconfig
          make O=out -j$(nproc) CC=clang \
            LLVM=1 LLVM_IAS=1 \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Pack boot.img (using prebuilt GKI ramdisk)
        run: |
          mkdir -p out/boot
          cp out/arch/arm64/boot/Image.gz-dtb out/boot/
          wget -O out/boot/ramdisk-gki.img https://dl.google.com/android/gki/ramdisk-android14-5.4.img
          wget -O mkbootimg.py https://raw.githubusercontent.com/osm0sis/mkbootimg_tools/master/mkbootimg.py
          python3 mkbootimg.py --kernel out/boot/Image.gz-dtb \
            --ramdisk out/boot/ramdisk-gki.img \
            --dtb out/boot/Image.gz-dtb \
            --pagesize 4096 --base 0x00000000 \
            --cmdline "console=ttyMSM0,115200n8 androidboot.hardware=qcom" \
            -o out/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gki-bootimg
          path: out/boot.img
